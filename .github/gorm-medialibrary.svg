<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="24" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="820" cy="40" r="120" fill="#22d3ee" opacity="0.06"/>
  <circle cx="60" cy="300" r="90" fill="#34d399" opacity="0.06"/>

  <!-- Media library icon (stacked images) -->
  <g transform="translate(90,100)" filter="url(#shadow)">
    <rect x="30" y="20" width="130" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="15" y="10" width="130" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="0" width="130" height="100" rx="14" fill="url(#accent)"/>
    <circle cx="38" cy="30" r="9" fill="#0f172a"/>
    <path d="M10 85 L45 50 L70 72 L90 55 L120 85 Z" fill="#0f172a" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="290" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">gorm-medialibrary</text>

  <!-- Accent line -->
  <rect x="292" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="292" y="196" width="70" height="32" rx="16" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9"/>
    <text x="327" y="217" text-anchor="middle" fill="#7dd3fc">Go</text>

    <rect x="372" y="196" width="90" height="32" rx="16" fill="#34d399" opacity="0.2" stroke="#34d399"/>
    <text x="417" y="217" text-anchor="middle" fill="#6ee7b7">GORM</text>

    <rect x="472" y="196" width="110" height="32" rx="16" fill="#f59e0b" opacity="0.2" stroke="#f59e0b"/>
    <text x="527" y="217" text-anchor="middle" fill="#fcd34d">Polymorphic</text>

    <rect x="592" y="196" width="100" height="32" rx="16" fill="#a78bfa" opacity="0.2" stroke="#a78bfa"/>
    <text x="642" y="217" text-anchor="middle" fill="#c4b5fd">Storage</text>
  </g>
</svg>